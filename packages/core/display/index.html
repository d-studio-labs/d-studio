<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D-Studio</title>
    <style>
      :root {
        --bg: #0e0e0d;
        --panel: #151513;
        --line: #262622;
        --grid: #2c2c27;
        --ink: #d9d4c7;
        --ink-dim: #7d7a70;
        --accent: #f0a14a;
        --error: #ff6b5a;
        --lanes: #c98a45, #4fc3c9, #8fa66a, #b97fbf, #d6c27a, #6f8fd6, #9aa6a6;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
      }
      body {
        position: relative;
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        display: grid;
        grid-template-rows: 1fr auto;
        grid-template-areas: 'lanes' 'status';
      }
      #lanes,
      #spatial {
        grid-area: lanes;
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
      }
      canvas[hidden] {
        display: none !important;
      }
      nav {
        display: flex;
        gap: 2px;
      }
      nav button {
        font: inherit;
        color: var(--ink-dim);
        background: none;
        border: 1px solid transparent;
        padding: 0 8px;
        cursor: pointer;
      }
      nav button[aria-selected='true'] {
        color: var(--accent);
        border-color: var(--line);
      }
      #legend {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 2;
        display: grid;
        gap: 1px;
        padding: 6px;
        border: 1px solid var(--line);
        background: rgb(14 14 13 / 0.7);
        font-size: 12px;
      }
      #legend[hidden] {
        display: none;
      }
      #legend .row {
        display: grid;
        grid-template-columns: 8px 76px 52px 96px;
        align-items: center;
        gap: 8px;
        padding: 1px 4px;
        color: var(--ink-dim);
        cursor: pointer;
      }
      #legend .row.on {
        color: var(--ink);
      }
      #legend .row.pin {
        outline: 1px solid var(--accent);
      }
      #legend .crowd {
        white-space: pre;
        padding: 4px 4px 0;
        color: #e0743a;
      }
      #legend .crowd:empty {
        display: none;
      }
      #legend .sw {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      #legend .bar {
        height: 3px;
        background: var(--line);
      }
      #legend .bar i {
        display: block;
        height: 100%;
        background: currentColor;
        transform-origin: left;
      }
      #views {
        position: absolute;
        top: 10px;
        left: 12px;
        z-index: 2;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        max-width: 62%;
        font-size: 12px;
      }
      #views[hidden] {
        display: none;
      }
      #views button {
        font: inherit;
        color: var(--ink-dim);
        background: rgb(14 14 13 / 0.7);
        border: 1px solid var(--line);
        padding: 2px 8px;
        cursor: pointer;
      }
      #views button.on {
        color: var(--accent);
        border-color: var(--accent);
      }
      footer {
        grid-area: status;
        display: flex;
        gap: 20px;
        align-items: center;
        padding: 6px 14px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink-dim);
      }
      #track,
      #time {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      #state[data-on='1'] {
        color: var(--accent);
      }
      #msg {
        margin-left: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #msg[data-kind='error'] {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <canvas id="lanes"></canvas>
    <canvas id="spatial" hidden></canvas>
    <footer>
      <nav role="tablist">
        <button role="tab" data-mode="lanes" aria-selected="true" title="key 1">lanes</button>
        <button role="tab" data-mode="spatial" aria-selected="false" title="key 2">spatial</button>
      </nav>
      <span id="track"></span>
      <span id="state">○ waiting for d-studio play</span>
      <span id="time"></span>
      <span id="bar">bar 1 · 1/4</span>
      <span id="bpm"></span>
      <span id="msg"></span>
    </footer>
    <script type="module">
      import '@d-studio-labs/core/main'
    </script>
  </body>
</html>
