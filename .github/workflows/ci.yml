name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: install & check (engine + examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # audio-free sanity check: parses every track in the example project
      # through the real engine (no SuperCollider/SuperDirt needed)
      - run: npm run check --workspace examples/playground

  scaffold:
    name: scaffold a new project (create.sh)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # exercises packages/create/create.sh exactly as a new user would,
      # against this branch's own repo/ref (so a PR tests its own template
      # and version pins, not whatever's currently on main)
      - name: scaffold via create.sh
        env:
          D_STUDIO_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          D_STUDIO_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: sh packages/create/create.sh ci-scaffold-test
      # create.sh already ran `npm install` for us
      - name: lint, format-check and sanity-check the scaffolded project
        working-directory: ci-scaffold-test
        run: |
          npm run lint
          npm run format:check
          npm run check
